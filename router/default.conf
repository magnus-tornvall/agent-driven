# Routes by Host. A preview's web container is on the shared network `preview-router` under the alias
# todo-<slug>, so a Host of <slug>.localhost[:port] goes to todo-<slug>:8000. Nothing is looked up from a list,
# so a preview that is started, recreated or removed needs no change or restart here: names are resolved
# through Docker's resolver per request, and kept for 1 s at most (a longer time could send a name to the
# address a removed preview had, if another preview took that address).

resolver 127.0.0.11 valid=1s ipv6=off;

# Anything that is not <slug>.localhost (an IP, plain localhost, another name) is not a preview.
server {
    listen 8080 default_server;
    location / { default_type text/plain; return 404 "No preview here: use http://<slug>.localhost:8080 (scripts/preview url).\n"; }
}

server {
    listen 8080;
    server_name ~^(?<slug>[a-z0-9][a-z0-9-]*)\.localhost(:[0-9]+)?$;

    location / {
        set $upstream http://todo-$slug:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        # Not resolvable (no such preview, or torn down) or not answering: an error, never another branch.
        error_page 502 503 504 = @nopreview;
    }

    location @nopreview {
        default_type text/plain;
        return 404 "No preview is running at $host. Start it with: scripts/preview up <branch>\n";
    }
}
